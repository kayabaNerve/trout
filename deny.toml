[advisories]
version = 2

db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]

unsound = "all"
unmaintained = "all"
yanked = "deny"

ignore = []

[licenses]
version = 2

include-dev = true
include-build = true

allow = [
  # Attribution required
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Zlib",

  # Non-invasive copyleft
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "LGPL-3.0-only"
]

exceptions = [
  { allow = ["GPL-3.0-or-later", "AGPL-3.0-only"], name = "bicycl" },
  { allow = ["AGPL-3.0-only"], name = "class-groups" },
  { allow = ["AGPL-3.0-only"], name = "threshold-ecdsa" },
]

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
  { path = "LICENSE", hash = 0xbd0eed23 }
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
deny = [
  # Contains a non-reproducible binary blob
  # https://github.com/serde-rs/serde/pull/2514
  # https://github.com/serde-rs/serde/issues/2575
  { name = "serde_derive", version = ">=1.0.172, <1.0.185" },
  # Introduced an insecure implementation of `borsh` removed with `0.15.1`
  # https://github.com/rust-lang/hashbrown/issues/576
  { name = "hashbrown", version = "=0.15.0" },
  # Incorrect implementation of cSHAKE
  # https://github.com/RustCrypto/hashes/pull/834
  { name = "cshake", version = "<0.1.1" },
  { name = "sha3", version = ">=0.10.2, <0.10.9" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
